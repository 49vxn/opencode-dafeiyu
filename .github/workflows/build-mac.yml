name: build-mac
# Builds the macOS dmg. Tag pushes (v*) publish straight to the matching
# GitHub release; manual runs only upload a downloadable artifact so a beta
# can be tested (Fajar) before a version is cut.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install deps
        working-directory: widget
        run: npm ci

      - name: build dmg (tag -> publish to release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: widget
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: build dmg (manual -> artifact only)
        if: startsWith(github.ref, 'refs/tags/v') != true
        working-directory: widget
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: upload dmg artifact (manual runs)
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-mac-dmg
          path: widget/dist/*.dmg
          if-no-files-found: error
